function Modal({ onClose, title, children, wide }) {

function Field({ label, required, error, children, hint }) {

function Btn({ children, onClick, href, kind = "primary", className = "", type, disabled, ...rest }) {
  const base = "inline-flex items-center justify-center gap-2 rounded-xl px-5 py-3 text-sm font-semibold transition focus-visible:outline-sky-600 disabled:opacity-50";
  const kinds = {
    primary: "bg-sky-600 text-white hover:bg-sky-700 shadow-lg shadow-sky-600/25",

    dark: "bg-slate-900 text-white hover:bg-slate-800",
    danger: "bg-red-50 text-red-600 ring-1 ring-red-200 hover:bg-red-100",

  const c = cx(base, kinds[kind], className);
  if (href) return <a href={href} target={href.startsWith("http") ? "_blank" : undefined} rel="noopener noreferrer" className={c} {...rest}>{children}</a>;
  return <button type={type || "button"} onClick={onClick} disabled={disabled} className={c} {...rest}>{children}</button>;
}
function FileBtn({ label, accept, onFile, className = "" }) {

/* ---------- lead form (shared by modal + contact section) ---------- */
function LeadForm({ plan, source, countries, onSaved, compact }) {
  const [f, setF] = useState({ name: "", email: "", clinic: "", country: "", phone: "" });
  const [err, setErr] = useState({});
  const [done, setDone] = useState(null);
  const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
  const submit = (e) => {
    e.preventDefault();
    const er = {};
    if (f.name.trim().length < 2) er.name = "Please enter your full name.";
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(f.email.trim())) er.email = "Please enter a valid work email address.";
    if (f.clinic.trim().length < 2) er.clinic = "Please enter your clinic name.";
    if (!f.country) er.country = "Please select your country.";
    if (f.phone.trim() && !/^[+\d][\d\s\-()]{6,}$/.test(f.phone.trim())) er.phone = "Please enter a valid phone number or leave blank.";
    setErr(er);
    if (Object.keys(er).length) return;
    const lead = { id: Date.now(), ...f, name: f.name.trim(), email: f.email.trim(), clinic: f.clinic.trim(), plan: plan || "General demo request", source, at: new Date().toISOString() };
    onSaved(lead); setDone(lead);
  };
  if (done) {
    const msg = "Hello Abdul, I'm " + done.name + " from " + done.clinic + " (" + done.country + "). I'd like to book a free demo" + (plan ? " and learn more about: " + plan : "") + ". My email: " + done.email + ".";
    return (
      <div className="pop text-center">
        <div className="mx-auto w-14 h-14 rounded-full bg-emerald-100 text-emerald-600 grid place-items-center mb-4"><Icon n="check" className="w-7 h-7" /></div>
        <h4 className="text-xl font-bold text-slate-900">Thank you, {done.name.split(" ")[0]}.</h4>
        <p className="mt-2 text-slate-600 text-sm leading-relaxed">Your details for <b>{done.clinic}</b> are ready. To make sure Abdul receives your request straight away, send it with one tap below. He will reply personally to arrange your free demo.</p>
        <div className="mt-6 grid gap-3">
          <Btn kind="wa" href={waLink(msg)}><WaIcon className="w-5 h-5" />Send on WhatsApp to Abdul Moaiz</Btn>
          <Btn kind="ghost" href={"mailto:" + EMAIL + "?subject=" + encodeURIComponent("Free demo request: " + done.clinic) + "&body=" + encodeURIComponent(msg)}><Icon n="mail" className="w-4 h-4" />Or send by email</Btn>
        </div>
      </div>
    );
  }
  return (
    <form onSubmit={submit} noValidate className="grid gap-4">
      {plan && <div className="rounded-xl bg-sky-50 ring-1 ring-sky-100 px-4 py-3 text-sm text-sky-800"><b>Selected:</b> {plan}</div>}
      <Field label="Full Name" required error={err.name}><input className={inputCls} value={f.name} onChange={set("name")} autoComplete="name" placeholder="Dr. Jane Smith" /></Field>
      <Field label={compact ? "Clinic Email" : "Work Email Address"} required error={err.email}><input type="email" className={inputCls} value={f.email} onChange={set("email")} autoComplete="email" placeholder="you@yourclinic.com" /></Field>
      <Field label="Clinic Name" required error={err.clinic}><input className={inputCls} value={f.clinic} onChange={set("clinic")} placeholder="Riverside Medical Centre" /></Field>
      <Field label="Country" required error={err.country}>
        <select className={inputCls} value={f.country} onChange={set("country")}>
          <option value="">Select country</option>{countries.map((c) => <option key={c}>{c}</option>)}
        </select>
      </Field>
      <Field label="WhatsApp / Phone Number" error={err.phone}><input type="tel" className={inputCls} value={f.phone} onChange={set("phone")} autoComplete="tel" placeholder="+44 7700 900123" /></Field>
      <Btn type="submit" className="w-full">Book a Free Demo<Icon n="arrow" className="w-4 h-4" /></Btn>
      <p className="text-xs text-slate-500 text-center">We only ask for the basics. Booking system and calendar details are covered on the discovery call.</p>
    </form>
  );
}

/* ---------- admin login ---------- */
function LoginModal({ onClose, onOk }) {
  const [email, setEmail] = useState(""); const [pw, setPw] = useState(""); const [err, setErr] = useState(""); const [busy, setBusy] = useState(false);
  const go = async (e) => {
    e.preventDefault(); setErr("");
    const em = email.trim().toLowerCase();
    if (!OWNER_HASHES[em]) { setErr("Unauthorized email. Only the Bangash Flow owner can access the admin portal."); return; }
    if (!(window.crypto && crypto.subtle)) { setErr("Secure context required. Open this page over HTTPS."); return; }
    setBusy(true);
    const h = await sha256("bf-admin-v1|" + em + "|" + pw);
    await new Promise((r) => setTimeout(r, 700));
    setBusy(false);
    if (h === OWNER_HASHES[em]) { try { sessionStorage.setItem("bf_admin", "1"); } catch (x) {} onOk(); } else setErr("Incorrect password.");
  };
  return (
    <Modal onClose={onClose} title="Owner Admin Login">
      <form onSubmit={go} className="grid gap-4">
        <p className="text-sm text-slate-600">Two-step owner verification: authorized email and admin password.</p>
        <Field label="Authorized owner email" required><input type="email" className={inputCls} value={email} onChange={(e) => setEmail(e.target.value)} autoComplete="username" /></Field>
        <Field label="Admin password" required><input type="password" className={inputCls} value={pw} onChange={(e) => setPw(e.target.value)} autoComplete="current-password" /></Field>
        {err && <div role="alert" className="rounded-xl bg-red-50 ring-1 ring-red-200 text-red-700 text-sm px-4 py-3">{err}</div>}
        <Btn type="submit" disabled={busy}>{busy ? "Verifying..." : "Sign in"}</Btn>
      </form>
    </Modal>
  );
}

}

              <div className={cx("max-w-[82%] rounded-2xl px-4 py-2.5 text-sm leading-relaxed shadow-sm", m.w === "p" ? "bg-sky-600 text-white rounded-br-md" : "bg-white text-slate-800 ring-1 ring-slate-100 rounded-bl-md")}>{m.t}</div>

                <article key={p.id} className={cx("relative rounded-3xl p-8 flex flex-col", p.popular ? "bg-gradient-to-b from-sky-600 to-sky-700 text-white shadow-2xl shadow-sky-600/30 lg:-translate-y-3" : "bg-white ring-1 ring-slate-200")}>
                  {p.popular && <span className="absolute -top-3 left-1/2 -translate-x-1/2 bg-amber-300 text-slate-900 text-xs font-extrabold rounded-full px-4 py-1">Most Popular</span>}
                  <div className="flex items-center justify-between"><h3 className="text-xl font-extrabold">{p.name}</h3>{admin && <button onClick={() => setPlanEdit(p)} className="inline-flex items-center gap-1.5 text-xs font-bold rounded-full bg-amber-100 text-amber-800 px-3 py-1.5"><Icon n="edit" className="w-3.5 h-3.5" />Admin: Edit Plan</button>}</div>
                  <p className="mt-5 text-4xl font-extrabold">{fmt(p.setup, cur)} <span className={cx("text-sm font-semibold", p.popular ? "text-sky-100" : "text-slate-500")}>one-time setup</span></p>
                  <p className={cx("mt-1 font-semibold", p.popular ? "text-sky-50" : "text-sky-700")}>+ {fmt(p.monthly, cur)}/month management</p>
                  <dl className={cx("mt-6 divide-y text-sm", p.popular ? "divide-white/15" : "divide-slate-100")}>
                    {planRows.map(([k, l]) => <div key={k} className="py-3"><dt className={cx("text-xs font-bold uppercase tracking-wider", p.popular ? "text-sky-200" : "text-slate-400")}>{l}</dt><dd className="mt-0.5 font-medium leading-snug">{p[k]}</dd></div>)}
                  </dl>
                  <div className="mt-auto pt-6 grid gap-3">
                    <Btn onClick={() => openLead(p.name + " package", "Pricing: " + p.name)} className={p.popular ? "!bg-white !text-sky-700 hover:!bg-sky-50 shadow-none" : ""}>Inquire About {p.name}</Btn>
                    <Btn kind="wa" href={waLink("Hello Abdul, I'd like to know more about the " + p.name + " package for my clinic.")}><WaIcon />WhatsApp Us About {p.name}</Btn>
                  </div>
                </article>
              ))}
            </div>
            <div className="mt-10 rounded-3xl bg-sky-50 ring-1 ring-sky-100 p-7 flex flex-col md:flex-row items-center justify-between gap-5">
              <div className="flex items-start gap-4"><div className="w-11 h-11 rounded-xl bg-white text-sky-600 grid place-items-center shrink-0"><Icon n="users" /></div><div><h3 className="font-bold">Multi-location group or custom workflow?</h3><p className="text-sm text-slate-600 mt-1">We scope bespoke systems for multi-site clinics and specialist workflows. Tell us what you need.</p></div></div>
              <Btn onClick={() => openLead("Custom multi-location workflow", "Pricing: custom banner")} className="shrink-0">Discuss a Custom Build</Btn>
            </div>
          </div>
        </section>

        {/* OFFERS */}
        <section id="offers" className="py-20">
          <div className="max-w-7xl mx-auto px-4 sm:px-6">
            <SectionHead eyebrow="Special offers" title="Current offers for new clinic partners" />
            {admin && <div className="flex justify-center mb-8"><Btn kind="ghost" onClick={() => setHub(true)}><Icon n="sliders" className="w-4 h-4" />Admin: Manage Offers</Btn></div>}
            {visibleOffers.length === 0 && <p className="text-center text-slate-500">No offers are running right now. Book a demo and ask about current options.</p>}
            <div className="grid md:grid-cols-3 gap-6">
              {visibleOffers.map((o) => {
                const th = THEMES[o.theme] || THEMES.sky; const expired = o.validUntil && new Date(o.validUntil + "T23:59:59") < now;
                return (
                  <article key={o.id} id={"offer-" + o.id} className={cx("rounded-3xl p-8 bg-gradient-to-br shadow-xl flex flex-col", th.cls, hl === o.id && "flash ring-4 ring-amber-300")}>
                    <div className="flex items-center justify-between gap-2"><span className="text-xs font-extrabold uppercase tracking-wider bg-white/20 rounded-full px-3 py-1">{o.tag || "Offer"}</span>{expired && <AdminTag>Expired (hidden)</AdminTag>}</div>
                    <h3 className="mt-4 text-2xl font-extrabold leading-tight">{o.title}</h3>
                    <p className="mt-4 text-4xl font-extrabold">{fmt(o.price, cur)}{o.was != null && <span className="ml-3 text-lg font-semibold line-through opacity-60">{fmt(o.was, cur)}</span>}</p>
                    <p className={cx("text-xs font-bold uppercase tracking-wider mt-1", th.sub)}>{o.priceNote}</p>
                    <p className={cx("mt-4 text-sm leading-relaxed", th.sub)}>{o.desc}</p>
                    <ul className="mt-4 space-y-2 text-sm">{(o.perks || []).map((x) => <li key={x} className="flex items-start gap-2"><Icon n="check" className="w-4 h-4 mt-0.5 shrink-0" />{x}</li>)}</ul>
                    {o.validUntil && <p className={cx("mt-4 text-xs font-semibold", th.sub)}>Valid until {new Date(o.validUntil).toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" })}</p>}
                    <div className="mt-auto pt-6 grid gap-2.5">
                      <button onClick={() => openLead(o.title + " (offer)", "Offer: " + o.id)} className={cx("rounded-xl px-5 py-3 text-sm font-bold transition", th.btn)}>Claim This Offer</button>
                      <div className="grid grid-cols-[1fr_auto] gap-2.5">
                        <a href={waLink("Hello Abdul, I'm interested in the offer: " + o.title + ".")} target="_blank" rel="noopener noreferrer" className="inline-flex items-center justify-center gap-2 rounded-xl bg-emerald-500 text-white px-4 py-3 text-sm font-bold hover:bg-emerald-600"><WaIcon className="w-4 h-4" />WhatsApp</a>
                        <button onClick={() => share(o.id)} aria-label={"Copy share link for " + o.title} className="inline-flex items-center justify-center gap-1.5 rounded-xl bg-black/15 hover:bg-black/25 px-4 py-3 text-sm font-bold"><Icon n={copied === o.id ? "check" : "share"} className="w-4 h-4" />{copied === o.id ? "Copied" : "Share"}</button>
                      </div>
                    </div>
                  </article>
                );
              })}
            </div>
          </div>
        </section>

        {/* DEMOS */}
        <section id="demos" className="py-20 bg-white border-y border-sky-100">
          <div className="max-w-7xl mx-auto px-4 sm:px-6">
            <SectionHead eyebrow="Demo projects" title="See what a Bangash Flow system looks like" sub="Concept demonstrations of common clinic scenarios. Tap a card to open it." />
            {admin && <div className="flex justify-center mb-8"><Btn kind="ghost" onClick={() => setUpload("demo")}><Icon n="upload" className="w-4 h-4" />Admin: Upload Demo</Btn></div>}
            <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
              {demos.map((d) => (
                <article key={d.id} className="relative rounded-3xl overflow-hidden ring-1 ring-slate-200 bg-white hover:shadow-xl hover:shadow-sky-900/10 transition">
                  <button onClick={() => setLight(d)} className="block w-full text-left" aria-label={"Open demo: " + d.title}>
                    <div className="relative aspect-[16/10] bg-gradient-to-br from-sky-100 to-sky-50 grid place-items-center overflow-hidden">
                      {d.media && d.media.kind === "image" && <img src={d.media.src} alt={d.title} className="absolute inset-0 w-full h-full object-cover" />}
                      {d.media && d.media.kind === "video" && <><video src={d.media.src} className="absolute inset-0 w-full h-full object-cover" muted playsInline preload="metadata" /><span className="relative w-14 h-14 rounded-full bg-white/90 text-sky-700 grid place-items-center"><Icon n="play" fill className="w-6 h-6" /></span></>}
                      {!d.media && <div className="w-[78%] space-y-2">{(d.transcript || []).slice(0, 2).map((m, i) => <div key={i} className={cx("text-[11px] leading-snug rounded-xl px-3 py-2 shadow-sm max-w-[85%]", m[0] === "Patient" ? "ml-auto bg-sky-600 text-white" : "bg-white text-slate-700")}>{m[1]}</div>)}</div>}
                    </div>
                    <div className="p-6"><h3 className="font-bold text-lg">{d.title}</h3><p className="text-sky-700 text-sm font-semibold">{d.sub}</p><p className="mt-2 text-sm text-slate-600 leading-relaxed">{d.desc}</p>{d.concept && <p className="mt-3 text-[11px] font-bold uppercase tracking-wider text-slate-400">Concept demo</p>}</div>
                  </button>
                  {admin && !d.concept && <button onClick={() => confirm("Delete this demo?") && setDemos(demos.filter((x) => x.id !== d.id))} className="absolute top-3 right-3 inline-flex items-center gap-1 bg-white text-red-600 text-xs font-bold rounded-full px-3 py-1.5 shadow"><Icon n="trash" className="w-3.5 h-3.5" />Delete</button>}
                  {admin && d.concept && <button onClick={() => confirm("Remove this concept demo?") && setDemos(demos.filter((x) => x.id !== d.id))} className="absolute top-3 right-3 inline-flex items-center gap-1 bg-white text-red-600 text-xs font-bold rounded-full px-3 py-1.5 shadow"><Icon n="trash" className="w-3.5 h-3.5" />Delete</button>}
                </article>
              ))}
            </div>
          </div>
        </section>

        {/* TESTIMONIALS */}
        <section id="testimonials" className="py-20">
          <div className="max-w-7xl mx-auto px-4 sm:px-6">
            <SectionHead eyebrow="Clinic feedback" title="What clinic teams say" />
            {admin && <div className="flex justify-center mb-8"><Btn kind="ghost" onClick={() => setUpload("testi")}><Icon n="upload" className="w-4 h-4" />Admin: Upload Testimonial</Btn></div>}
            {testis.length === 0 ? (
              <div className="max-w-2xl mx-auto text-center bg-white rounded-3xl ring-1 ring-sky-100 p-10">
                <div className="mx-auto w-12 h-12 rounded-2xl bg-sky-50 text-sky-600 grid place-items-center mb-4"><Icon n="star" /></div>
                <h3 className="text-xl font-bold">We are onboarding our first clinic partners</h3>
                <p className="mt-2 text-slate-600 leading-relaxed">Rather than publish invented reviews, we only show feedback from real clinics. Be among the first partners and work directly with the founder on your build.</p>
                <Btn onClick={() => openLead("", "Testimonials empty state")} className="mt-6">Book a Free Demo</Btn>
              </div>
            ) : (
              <div className="grid md:grid-cols-3 gap-6">
                {testis.map((t) => (
                  <figure key={t.id} className="relative bg-white rounded-3xl ring-1 ring-slate-200 p-7 flex flex-col">
                    <div className="flex gap-0.5 text-amber-400" aria-label={t.rating + " out of 5 stars"}>{Array.from({ length: t.rating }).map((_, i) => <Icon key={i} n="star" fill className="w-4 h-4" />)}</div>
                    {t.quote && <blockquote className="mt-4 text-slate-700 leading-relaxed">“{t.quote}”</blockquote>}
                    {t.media && t.media.kind === "image" && <img src={t.media.src} alt={"Feedback from " + t.name} className="mt-4 rounded-xl ring-1 ring-slate-200" />}
                    {t.media && t.media.kind === "video" && <video src={t.media.src} controls playsInline className="mt-4 rounded-xl w-full" />}
                    {t.media && t.media.kind === "pdf" && <a href={t.media.src} target="_blank" rel="noopener noreferrer" className="mt-4 inline-flex items-center gap-2 text-sm font-semibold text-sky-700"><Icon n="file" className="w-4 h-4" />View PDF review</a>}
                    <figcaption className="mt-auto pt-5 text-sm"><b className="text-slate-900">{t.name}</b><br /><span className="text-slate-500">{[t.role, t.country].filter(Boolean).join(" · ")}</span></figcaption>
                    {admin && <button onClick={() => confirm("Delete this testimonial?") && setTestis(testis.filter((x) => x.id !== t.id))} className="absolute top-3 right-3 inline-flex items-center gap-1 bg-red-50 text-red-600 text-xs font-bold rounded-full px-3 py-1.5"><Icon n="trash" className="w-3.5 h-3.5" />Delete</button>}
                  </figure>
                ))}
              </div>
            )}
          </div>
        </section>

        {/* CONTACT */}
        <section id="contact" className="py-20 bg-gradient-to-b from-white to-sky-50 border-t border-sky-100">
          <div className="max-w-6xl mx-auto px-4 sm:px-6 grid lg:grid-cols-2 gap-12 items-start">
            <div>
              <p className="text-xs font-bold tracking-widest uppercase text-sky-600 mb-3">Get started</p>
              <h2 className="text-3xl sm:text-4xl font-extrabold tracking-tight">Book your free demo</h2>
              <p className="mt-4 text-slate-600 text-lg leading-relaxed">Tell us about your clinic and Abdul will personally reach out to show how an AI receptionist would work with your schedules, doctors and booking system.</p>
              <div className="mt-8 grid gap-4">
                <a href={"mailto:" + EMAIL} className="flex items-center gap-4 bg-white rounded-2xl ring-1 ring-slate-200 p-5 hover:ring-sky-300"><div className="w-11 h-11 rounded-xl bg-sky-50 text-sky-600 grid place-items-center"><Icon n="mail" /></div><div><p className="text-xs font-bold uppercase tracking-wider text-slate-400">Email</p><p className="font-semibold">{EMAIL}</p></div></a>
                <a href={waLink("Hello Abdul, I'd like to know more about Bangash Flow.")} target="_blank" rel="noopener noreferrer" className="flex items-center gap-4 bg-white rounded-2xl ring-1 ring-slate-200 p-5 hover:ring-emerald-300"><div className="w-11 h-11 rounded-xl bg-emerald-50 text-emerald-600 grid place-items-center"><WaIcon /></div><div><p className="text-xs font-bold uppercase tracking-wider text-slate-400">Phone &amp; WhatsApp</p><p className="font-semibold">{PHONE}</p></div></a>
              </div>
            </div>
            <div className="bg-white rounded-3xl ring-1 ring-sky-100 shadow-xl shadow-sky-900/5 p-7 sm:p-8">
              <LeadForm compact source="Contact section" countries={["United Kingdom", "United States", "Canada", "Australia"]} onSaved={saveLead} />
            </div>
          </div>
        </section>
      </main>

      {/* FOOTER */}
      <footer className="bg-slate-900 text-slate-300">
        <div className="max-w-7xl mx-auto px-4 sm:px-6 py-14 grid md:grid-cols-3 gap-10">
          <div>
            <div className="flex items-center gap-3"><Logo src={logoSrc} /><div className="leading-tight"><p className="font-extrabold text-white">Bangash Flow</p><p className="text-[10px] uppercase tracking-widest text-sky-300">Medical Automation Systems</p></div></div>
            <p className="mt-4 text-sm text-slate-400 leading-relaxed">The 24/7 AI receptionist for medical, dental and healthcare clinics.</p>
          </div>
          <nav aria-label="Footer"><p className="text-xs font-bold uppercase tracking-widest text-slate-500 mb-4">Quick links</p><ul className="grid grid-cols-2 gap-2 text-sm">{nav.map(([l, id]) => <li key={id}><a href={"#" + id} className="hover:text-white">{l}</a></li>)}</ul></nav>
          <div>
            <p className="text-xs font-bold uppercase tracking-widest text-slate-500 mb-4">Contact</p>
            <ul className="space-y-2 text-sm"><li><a className="hover:text-white" href={"mailto:" + EMAIL}>{EMAIL}</a></li><li><a className="hover:text-white" href={waLink("Hello Abdul")} target="_blank" rel="noopener noreferrer">{PHONE}</a></li><li><a className="hover:text-white" href={LINKEDIN} target="_blank" rel="noopener noreferrer">Abdul Moaiz on LinkedIn</a></li></ul>
            <Btn onClick={() => openLead("", "Footer CTA")} className="mt-5">Book a Free Demo</Btn>
          </div>
        </div>
        <div className="border-t border-white/10">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 py-6 text-xs text-slate-500 leading-relaxed">
            <p><b className="text-slate-400">Healthcare disclaimer:</b> Bangash Flow provides administrative automation (booking, reminders and information) only. Our systems do not diagnose, treat or give medical advice, and are not a substitute for professional clinical judgement or emergency services. In an emergency, contact your local emergency number.</p>
            <p className="mt-3">© 2026 Bangash Flow. All rights reserved.</p>
          </div>
        </div>
      </footer>

      {/* FLOATING WHATSAPP */}
      <div className="fixed right-4 z-40 group" style={{ bottom: "calc(16px + env(safe-area-inset-bottom, 0px))" }}>
        <span className="pointer-events-none absolute right-16 top-1/2 -translate-y-1/2 whitespace-nowrap rounded-lg bg-slate-900 text-white text-xs font-semibold px-3 py-2 opacity-0 group-hover:opacity-100 group-focus-within:opacity-100 transition hidden sm:block">Chat with Abdul Moaiz on WhatsApp</span>
        <a href={waLink("Hello Abdul, I'd like to know more about Bangash Flow.")} target="_blank" rel="noopener noreferrer" aria-label="Chat with Abdul Moaiz on WhatsApp" className="pulse-ring relative w-14 h-14 rounded-full bg-emerald-500 text-white grid place-items-center shadow-xl hover:bg-emerald-600"><WaIcon className="w-7 h-7" /><span className="absolute top-0.5 right-0.5 w-3.5 h-3.5 rounded-full bg-emerald-300 ring-2 ring-white" /></a>
      </div>

      {/* ADMIN BAR */}
      {admin && <div className="fixed left-4 z-40 flex items-center gap-2 bg-amber-100 text-amber-900 rounded-full pl-4 pr-2 py-2 shadow-lg ring-1 ring-amber-300" style={{ bottom: "calc(16px + env(safe-area-inset-bottom, 0px))" }}><span className="text-xs font-bold">Admin mode</span><button onClick={() => setHub(true)} className="text-xs font-bold bg-white rounded-full px-3 py-1.5">Hub</button><button onClick={logout} className="text-xs font-bold bg-white rounded-full px-3 py-1.5">Log out</button></div>}

      {/* MODALS */}
      {leadModal && <Modal onClose={() => setLeadModal(null)} title="Book a Free Demo"><LeadForm plan={leadModal.plan} source={leadModal.source} countries={["United Kingdom", "United States", "Canada", "Australia", "Other"]} onSaved={saveLead} /></Modal>}
      {login && <LoginModal onClose={() => setLogin(false)} onOk={() => { setLogin(false); setAdmin(true); setHub(true); }} />}
      {admin && hub && <AdminHub onClose={() => setHub(false)} logo={logo} setLogo={setLogo} ceo={ceo} setCeo={setCeo} offers={offers} setOffers={setOffers} leads={leads} setLeads={setLeads} onEditOffer={(o) => setOfferEdit(o)} exportData={exportData} importData={importData} onLogout={logout} />}
      {admin && planEdit && <PlanEditor plan={planEdit} onClose={() => setPlanEdit(null)} onSave={(p) => { setPlans(plans.map((x) => (x.id === p.id ? p : x))); setPlanEdit(null); }} />}
      {admin && offerEdit && <OfferEditor offer={offerEdit} onClose={() => setOfferEdit(null)} onSave={(o) => { setOffers(offers.some((x) => x.id === o.id) ? offers.map((x) => (x.id === o.id ? o : x)) : [...offers, o]); setOfferEdit(null); }} />}
      {admin && upload && <MediaUploader mode={upload} onClose={() => setUpload(null)} onSave={(item) => { if (upload === "demo") setDemos([...demos, item]); else setTestis([...testis, item]); setUpload(null); }} />}
      {light && (
        <Modal onClose={() => setLight(null)} title={light.title} wide>
          {light.media && light.media.kind === "image" && <img src={light.media.src} alt={light.title} className="w-full rounded-2xl" />}
          {light.media && light.media.kind === "video" && <video src={light.media.src} controls autoPlay playsInline className="w-full rounded-2xl" />}
          {!light.media && <div className="space-y-3 bg-slate-50 rounded-2xl p-5">{(light.transcript || []).map((m, i) => <div key={i} className={cx("flex", m[0] === "Patient" ? "justify-end" : "justify-start")}><div className={cx("max-w-[85%] rounded-2xl px-4 py-2.5 text-sm", m[0] === "Patient" ? "bg-sky-600 text-white" : "bg-white ring-1 ring-slate-100")}><p className="text-[10px] font-bold uppercase tracking-wider opacity-60 mb-0.5">{m[0]}</p>{m[1]}</div></div>)}</div>}
          <p className="mt-4 text-sm text-slate-600">{light.desc}</p>
          {light.concept && <p className="mt-2 text-xs text-slate-400">Concept demo: an illustrative scenario, not a real patient conversation.</p>}
          <Btn onClick={() => { setLight(null); openLead("", "Demo: " + light.title); }} className="mt-5">Book a Free Demo</Btn>
        </Modal>
      )}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
